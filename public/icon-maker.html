<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Icon Maker - On Time Taxi</title>
<style>
body{background:#0b0b0b;color:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:28px;text-align:center}
h1{font-size:22px;margin:0 0 8px}
p{color:#bdbdbd;font-size:15px;line-height:1.5;max-width:520px;margin:0 auto 18px}
#pick{display:inline-block;background:#e11d2a;color:#fff;padding:14px 22px;border-radius:10px;font-weight:600;cursor:pointer}
#f{display:none}
canvas{width:260px;height:260px;margin:22px auto 10px;display:block;border-radius:22px;border:1px solid #333;background:#000}
#d{display:none;background:#1a7f37;color:#fff;padding:14px 22px;border-radius:10px;font-weight:600;text-decoration:none}
#sz{color:#8a8a8a;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<h1>App Icon Maker</h1>
<p>Pick your logo picture below. This builds the exact 1024 x 1024 square icon that Apple requires, on a solid black background with no see-through edges.</p>
<label id="pick" for="f">Choose my logo picture</label>
<input type="file" id="f" accept="image/*">
<canvas id="c" width="1024" height="1024"></canvas>
<a id="d" download="AppIcon-1024.png">Save the icon</a>
<div id="sz"></div>
<script>
var f=document.getElementById("f");
var c=document.getElementById("c");
var d=document.getElementById("d");
var sz=document.getElementById("sz");
var ctx=c.getContext("2d");
function blank(){ctx.fillStyle="#000000";ctx.fillRect(0,0,1024,1024);}
blank();
f.addEventListener("change",function(){
  var file=f.files&&f.files[0];
  if(!file){return;}
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      blank();
      var s=Math.min(1024/img.width,1024/img.height);
      var w=Math.round(img.width*s);
      var h=Math.round(img.height*s);
      ctx.drawImage(img,Math.round((1024-w)/2),Math.round((1024-h)/2),w,h);
      d.href=c.toDataURL("image/png");
      d.style.display="inline-block";
      sz.textContent="Ready. 1024 x 1024 PNG, no transparency.";
    };
    img.onerror=function(){sz.textContent="That file could not be read as a picture.";};
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
});
</script>
</body>
</html>
